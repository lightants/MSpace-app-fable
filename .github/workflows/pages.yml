# Publishes the customer pages (public/) to GitHub Pages on every push to main.
name: Publish pages
on:
  push:
    branches: [main]
    paths: ['public/**']
permissions:
  contents: write
jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
